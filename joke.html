            aria-label="Copy joke">
            📋
        </button>

<script>

    // =========================
    // GET HTML ELEMENTS
    // =========================

    const joke = document.getElementById("joke");
    const answer = document.getElementById("answer");

    const generateBtn = document.getElementById("generateBtn");
    const copyBtn = document.getElementById("copyBtn");
    const previousBtn = document.getElementById("previousBtn");

    const categoryButtons = document.querySelectorAll(".category-btn");


    // =========================
    // JOKE STORAGE
    // =========================

    let jokes = [];

    let currentJoke = -1;

    let selectedCategory = "Any";


    

    // =========================
    // CATEGORY BUTTONS
    

    categoryButtons.forEach(button => {

        button.addEventListener("click", () => {

            // Get selected category
            selectedCategory = button.dataset.category;


            // Remove active style from all buttons
            categoryButtons.forEach(btn => {

                btn.classList.remove(
                    "bg-black",
                    "text-white"
                );

                btn.classList.add("bg-white");

            });


            // Add active style to selected button
            button.classList.remove("bg-white");

            button.classList.add(
                "bg-black",
                "text-white"
            );

        });

    });


    // =========================
    // GENERATE JOKE
    // =========================

    async function generateJoke() {

        // Loading state
        joke.textContent = "Loading...";
        answer.textContent = "";


        try {

            // Ask JokeAPI for a joke
            const response = await fetch(
                `https://v2.jokeapi.dev/joke/${selectedCategory}?safe-mode`
            );


            // Convert response to JSON
            const data = await response.json();


            // Check for API error
            if (data.error) {

                throw new Error(data.message);

            }


            // =========================
            // TWO-PART JOKE
            // =========================

            if (data.type === "twopart") {

                // Question / setup
                joke.textContent = data.setup;

                // Answer / punchline
                answer.textContent = data.delivery;


            }


            // =========================
            // SINGLE JOKE
            // =========================

            else {

                joke.textContent = data.joke;

                answer.textContent = "";

            }


            // =========================
            // SAVE JOKE
            // =========================

            let newJoke;

            if (data.type === "twopart") {

                newJoke = {
                    question: data.setup,
                    answer: data.delivery
                };

            } else {

                newJoke = {
                    question: data.joke,
                    answer: ""
                };

            }


            jokes.push(newJoke);


            // Move to newest joke
            currentJoke = jokes.length - 1;


        } catch (error) {

            joke.textContent =
                "Oops! The joke machine is broken.";

            answer.textContent = "";

            console.error(error);

        }

    }


    // =========================
    // GENERATE BUTTON
    // =========================

    generateBtn.addEventListener(
        "click",
        generateJoke
    );


    // =========================
    // COPY JOKE
    // =========================

    copyBtn.addEventListener("click", async () => {

        // No joke yet
        if (currentJoke === -1) {

            return;

        }


        const current = jokes[currentJoke];


        // Combine question and answer
        const fullJoke = current.answer
            ? `${current.question}\n\n${current.answer}`
            : current.question;


        try {

            await navigator.clipboard.writeText(fullJoke);


            // Show copied icon
            copyBtn.textContent = "✓";


            // Return to clipboard icon
            setTimeout(() => {

                copyBtn.textContent = "📋";

            }, 1500);


        } catch (error) {

            console.error(
                "Could not copy joke:",
                error
            );

        }

    });


    // =========================
    // PREVIOUS JOKE
    // =========================

    previousBtn.addEventListener("click", () => {

        // Make sure there is a previous joke
        if (currentJoke > 0) {

            currentJoke--;


            const previousJoke =
                jokes[currentJoke];


            // Show previous question
            joke.textContent =
                previousJoke.question;


            // Show previous answer
            answer.textContent =
                previousJoke.answer;

        }

    });


</script>
